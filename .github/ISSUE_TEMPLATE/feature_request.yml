name: Feature request
description: Suggest a focused improvement to a real file workflow
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the file workflow and outcome you need. Please avoid confidential filenames, paths, document contents, and client information.
  - type: textarea
    id: workflow
    attributes:
      label: File workflow
      description: What files are involved, where do they come from, and what do you do today?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the friction or risk without prescribing an implementation first.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would be measurably easier or safer if this were implemented?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: How do you handle this workflow today?
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Request check
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: I removed private filenames, paths, document content, secrets, personal data, and client information.
          required: true
